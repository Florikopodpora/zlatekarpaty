<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Restaurace Zlaté Karpaty — Gastro Výzvy</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap');

    :root {
      --font-main: 'Plus Jakarta Sans', sans-serif;
      --font-display: 'Space Grotesk', sans-serif;
      --color-primary: #fe2c55; /* TikTok Red */
      --color-gold: #e5c365;
      --color-bg-app: #000000;
      --color-card: #121214;
      --border-color: rgba(255, 255, 255, 0.08);
      --radius-lg: 24px;
      --radius-md: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-main);
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0c0c0e;
      color: #ffffff;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Mobile Frame simulation on desktop */
    .bitesight-app-frame {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 100vh;
      background-color: var(--color-bg-app);
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), 0 0 0 10px rgba(255, 255, 255, 0.03);
      border-radius: 36px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    @media (max-width: 480px) {
      .bitesight-app-frame {
        max-width: 100%;
        height: 100vh;
        border-radius: 0;
        border: none;
        box-shadow: none;
      }
    }

    /* Header Overlay */
    .bitesight-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 64px;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
    }

    .logo-text {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }

    .logo-text span {
      color: var(--color-gold);
    }

    .city-badge {
      font-size: 9px;
      background: var(--color-gold);
      color: #000000;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 4px;
      font-weight: 800;
    }

    .call-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 6px 12px;
      border-radius: 99px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
    }

    /* Viewport Area */
    .bitesight-viewport {
      flex: 1;
      width: 100%;
      position: relative;
      overflow: hidden;
      margin-bottom: 64px; /* Space for navbar */
    }

    /* TikTok Style Snap Scroll Feed */
    .feed-container {
      width: 100%;
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .feed-container::-webkit-scrollbar {
      display: none;
    }

    .feed-item {
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .feed-bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      filter: brightness(0.65);
    }

    .feed-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 40%, rgba(0,0,0,0.2) 100%);
      z-index: 2;
    }

    .feed-content {
      position: relative;
      z-index: 3;
      padding: 24px 20px 80px 20px; /* Leave space for primary booking button */
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Floating bottom action button for booking */
    .feed-action-container {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      z-index: 10;
    }

    /* Navigation Bar */
    .bitesight-navbar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: rgba(10, 10, 12, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      flex: 1;
      height: 100%;
      font-size: 10px;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .nav-btn.active {
      color: #ffffff;
    }

    .nav-btn i {
      font-size: 16px;
    }

    /* Custom Input Styles */
    .bitesight-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-md);
      padding: 14px;
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: all 0.2s ease;
    }

    .bitesight-input:focus {
      border-color: var(--color-gold);
      background: rgba(255, 255, 255, 0.08);
    }

    /* Modal Sheet Styling */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      z-index: 1000;
      display: flex;
      align-items: flex-end; /* Slide up sheets */
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-sheet {
      width: 100%;
      max-width: 420px;
      background: #0f0f12;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 24px 20px;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-overlay.open .modal-sheet {
      transform: translateY(0);
    }

    /* Ticket Coupon Styling */
    .ticket-pass {
      background: linear-gradient(135deg, #18181c 0%, #111114 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-md);
      position: relative;
      padding: 16px;
    }

    .ticket-pass::before, .ticket-pass::after {
      content: '';
      position: absolute;
      bottom: 70px;
      width: 16px;
      height: 16px;
      background-color: var(--color-bg-app);
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .ticket-pass::before { left: -9px; }
    .ticket-pass::after { right: -9px; }

    /* Toast */
    .toast-container {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffffff;
      color: #000000;
      font-weight: 700;
      font-size: 12px;
      padding: 10px 20px;
      border-radius: 99px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      z-index: 2000;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    /* Views */
    .tab-view {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      padding: 70px 20px 20px 20px;
    }

    .tab-view::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body>

  <!-- App Wrapper Viewport Frame -->
  <div class="bitesight-app-frame">

    <!-- Top Overlay Header -->
    <header class="bitesight-header">
      <div class="logo-text">
        KARPATY<span>VÝZVY</span>

    <!-- Views Viewport container -->

              <!-- Options filled by JS -->
            </select>
          </div>

          <div id="booking-challenge-preview"></div>

          <div>

          <div>

          </div>

          <div class="space-y-3 pt-2 border-t border-white/5">

            <input type="text" id="booking-name" placeholder="Celé Jméno" class="bitesight-input text-xs" required />

          <div class="pt-3 border-t border-white/5 flex items-center justify-between">
            <div>
              <span class="text-[10px] text-gray-400 block">Rezervační záloha:</span>
              <strong id="booking-total-price" class="text-lg font-bold text-yellow-400">1 500 Kč</strong>
            </div>

            <button type="submit" class="w-auto bg-red-500 hover:bg-red-600 text-white font-bold py-2.5 px-5 rounded-xl text-xs transition-all">
              Pokračovat k platbě
            </button>
          </div>
        </form>
      </section>

      <!-- VIEW 3: RESERVATIONS (MY BOOKINGS TICKET PASSES) -->
      <section id="view-my-bookings" class="tab-view hidden space-y-4">
        <div>
          <h2 class="text-xl font-bold text-white">Moje Rezervace</h2>
          <p class="text-xs text-gray-400">Aktivní lístky a QR kódy pro soutěže</p>
        </div>
        <div id="my-bookings-list" class="space-y-3">
          <!-- Filled by JS -->
        </div>
      </section>

      <!-- VIEW 4: TIKTOK FEED & STATS -->
      <section id="view-tiktok" class="tab-view hidden space-y-4">
        <!-- Filled by JS -->
      </section>

      <!-- VIEW 5: PLAKÁT -->
      <section id="view-poster" class="tab-view hidden space-y-4">
        <div class="space-y-3 text-center">
          <h2 class="text-lg font-bold text-white">Oficiální Plakát Akce</h2>
          <div class="rounded-2xl overflow-hidden border border-white/10 shadow-2xl">
            <img src="assets/poster.jpg" alt="Plakát Zlaté Karpaty" class="w-full h-auto" />
          </div>
          <div class="bg-white/5 p-3.5 rounded-xl text-left text-xs text-gray-300 space-y-1.5 border border-white/5">
            <div class="font-bold text-yellow-400">Restaurace Zlaté Karpaty</div>
            <div>Adresa: Hornická 2511, Ústí nad Labem</div>
            <div>Telefon: <a href="tel:732781138" class="text-green-400 underline">732 781 138</a></div>
          </div>
        </div>
      </section>

    </div>

    <!-- Bitesight Bottom Fixed Navbar -->
    <nav class="bitesight-navbar">
      <button class="nav-btn active" onclick="switchView('challenges')">
        <i class="fa-solid fa-play"></i>
        <span>Výzvy</span>
      </button>
      <button class="nav-btn" onclick="switchView('booking')">
        <i class="fa-solid fa-calendar-plus"></i>
        <span>Rezervovat</span>
      </button>
      <button class="nav-btn" onclick="switchView('my-bookings')">
        <i class="fa-solid fa-ticket"></i>
        <span>Rezervace</span>
      </button>
      <button class="nav-btn" onclick="switchView('tiktok')">
        <i class="fa-brands fa-tiktok"></i>
        <span>TikTok</span>
      </button>
      <button class="nav-btn" onclick="switchView('poster')">
        <i class="fa-solid fa-image"></i>
        <span>Plakát</span>
      </button>
    </nav>

  </div>

  <!-- Sheets Modals -->
  <!-- 1. Detail Sheet -->
  <div id="detail-sheet" class="modal-overlay" onclick="closeSheet('detail-sheet')">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div id="detail-sheet-body"></div>
    </div>
  </div>

  <!-- 2. Payment Checkout Sheet -->
  <div id="payment-sheet" class="modal-overlay" onclick="closeSheet('payment-sheet')">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div id="payment-sheet-body"></div>
    </div>
  </div>

  <!-- 3. Ticket QR Sheet -->
  <div id="ticket-sheet" class="modal-overlay" onclick="closeSheet('ticket-sheet')">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div id="ticket-sheet-body"></div>
    </div>

  <!-- Floating Toast -->
  <div id="app-toast" class="toast-container"></div>

      ]
    };

    let activeTab = "challenges";
    let selectedBookingTime = "14:30";
    let inMemoryReservations = null;

    // LocalStorage wrap wrapper
    function getReservations() {
      try {
        const stored = localStorage.getItem("batryn_res");
        if (!stored) {
          localStorage.setItem("batryn_res", JSON.stringify(APP_DATA.sampleReservations));
          return APP_DATA.sampleReservations;
        }
        return JSON.parse(stored);
      } catch (e) {
        if (!inMemoryReservations) inMemoryReservations = [...APP_DATA.sampleReservations];
        return inMemoryReservations;
      }
    }

    function saveReservation(newRes) {
      try {
        const current = getReservations();
        current.unshift(newRes);
        localStorage.setItem("batryn_res", JSON.stringify(current));
      } catch (e) {
        if (!inMemoryReservations) inMemoryReservations = [...APP_DATA.sampleReservations];
        inMemoryReservations.unshift(newRes);
      }
    }

    // App Startup
    document.addEventListener("DOMContentLoaded", () => {
      renderFeed();
      renderBookingForm();
      renderMyBookings();
      renderTikTokView();
      switchView("challenges");
    });

    // View Switcher
    function switchView(tabId) {
      activeTab = tabId;
      document.querySelectorAll(".tab-view, .feed-container").forEach(v => v.classList.add("hidden"));
      
      const activeEl = document.getElementById(`view-${tabId}`);
      if (activeEl) activeEl.classList.remove("hidden");

      document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.classList.remove("active");
        if (btn.getAttribute("onclick").includes(tabId)) btn.classList.add("active");
      });

      if (tabId === "my-bookings") renderMyBookings();
      if (tabId === "tiktok") renderTikTokView();
    }

    // Feed / Challenges renderer
    function renderFeed() {
      const container = document.getElementById("view-challenges");
      if (!container) return;

      container.innerHTML = APP_DATA.challenges.map(c => `
        <div class="feed-item">
          <img src="${c.image}" class="feed-bg-img" alt="${c.title}" />
          <div class="feed-overlay"></div>
          
          <div class="feed-content">
            <span class="inline-block self-start px-2 py-0.5 rounded bg-black/80 text-[10px] font-bold text-white border border-white/10 uppercase tracking-widest mb-1">
              ${c.tag}
            </span>
            <h2 class="text-2xl font-black text-white leading-tight">${c.title}</h2>
            <p class="text-xs text-gray-300 leading-relaxed line-clamp-2">${c.description}</p>
            
            <div class="grid grid-cols-2 gap-3 p-3 bg-black/60 border border-white/5 rounded-xl text-center my-2">
              <div>
                <span class="text-[9px] text-gray-500 uppercase block">Výhra</span>
                <span class="text-sm font-bold text-green-400">${c.prize.toLocaleString()} Kč</span>
              </div>
              <div class="border-l border-white/10">
                <span class="text-[9px] text-gray-500 uppercase block">Záloha</span>
                <span class="text-sm font-bold text-red-400">${c.failFee} Kč</span>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2 mt-2">
              <button onclick="openRulesSheet('${c.id}')" class="bitesight-btn-secondary py-3 text-xs font-bold rounded-xl">
                Pravidla
              </button>
              <button onclick="startBooking('${c.id}')" class="bitesight-btn-primary py-3 text-xs font-bold rounded-xl bg-red-500 hover:bg-red-600">
                Zarezervovat
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Rule modal detail
    function openRulesSheet(id) {
      const challenge = APP_DATA.challenges.find(c => c.id === id);
      if (!challenge) return;

      const body = document.getElementById("detail-sheet-body");
      body.innerHTML = `
        <div class="space-y-4">
          <div class="image-container-4-3">
            <img src="${challenge.image}" alt="${challenge.title}" />
          </div>
          <div>
            <h3 class="text-lg font-bold text-white">${challenge.title}</h3>
            <p class="text-xs text-yellow-400">${challenge.subtitle}</p>
          </div>
          <div class="p-3 bg-white/5 rounded-lg space-y-1.5 text-xs text-gray-300 border border-white/5">
            <div class="font-bold text-white uppercase text-[10px]">Oficiální pravidla:</div>
            <ul class="list-disc list-inside space-y-1">
              ${challenge.rules.map(r => `<li>${r}</li>`).join('')}
            </ul>
          </div>
          <button onclick="closeSheet('detail-sheet'); startBooking('${challenge.id}')" class="bitesight-btn-primary w-full py-3">
            Přejít k rezervaci (${challenge.failFee} Kč)
          </button>
        </div>
      `;
      openSheet('detail-sheet');
    }

    function startBooking(id) {
      closeSheet('detail-sheet');
      switchView("booking");
      const select = document.getElementById("booking-challenge-select");
      if (select) {
        select.value = id;
        triggerChallengeChange(id);
      }
    }

    // Booking Wizard
    function renderBookingForm() {
      const select = document.getElementById("booking-challenge-select");
      if (!select) return;

      select.innerHTML = APP_DATA.challenges.map(c => `
        <option value="${c.id}">${c.title} (Záloha: ${c.failFee} Kč)</option>
      `).join('');

      select.addEventListener("change", (e) => triggerChallengeChange(e.target.value));

      // Setup tomorrow min date
      const dateInput = document.getElementById("booking-date");
      const tom = new Date();
      tom.setDate(tom.getDate() + 1);
      dateInput.min = tom.toISOString().split('T')[0];
      dateInput.value = tom.toISOString().split('T')[0];

      // Time Chips
      const times = ["11:30", "13:00", "14:30", "16:00", "17:30", "19:00", "20:30"];
      const chipsContainer = document.getElementById("booking-time-chips");
      if (chipsContainer) {
        chipsContainer.innerHTML = times.map((t, idx) => `
          <button type="button" class="time-chip bitesight-btn-secondary py-2 px-1 text-[11px] rounded ${idx === 2 ? 'bg-red-500 border-red-500 text-white' : ''}" onclick="selectTimeChip(this, '${t}')">
            ${t}
          </button>
        `).join('');
      }

      triggerChallengeChange(APP_DATA.challenges[0].id);
    }

    function triggerChallengeChange(id) {
      const challenge = APP_DATA.challenges.find(c => c.id === id);
      const preview = document.getElementById("booking-challenge-preview");
      const price = document.getElementById("booking-total-price");
      
      if (preview && challenge) {
        preview.innerHTML = `
          <div class="bitesight-card p-3 flex items-center gap-3 bg-white/5 border border-white/5">
            <img src="${challenge.image}" class="w-12 h-12 object-cover rounded" />
            <div>
              <h4 class="font-bold text-xs text-white">${challenge.title}</h4>
              <span class="text-[10px] text-green-400">Výhra: ${challenge.prize.toLocaleString()} Kč</span>
            </div>
          </div>
        `;
      }
      if (price && challenge) {
        price.innerText = `${challenge.failFee} Kč`;
      }
    }

    function selectTimeChip(btn, val) {
      document.querySelectorAll(".time-chip").forEach(c => c.classList.remove("bg-red-500", "border-red-500", "text-white"));
      btn.classList.add("bg-red-500", "border-red-500", "text-white");
      selectedBookingTime = val;
    }

    // Reservation Checkout Modal
    let activeCheckout = null;

    function handleBookingSubmit(e) {
      if (e) e.preventDefault();
      
      const select = document.getElementById("booking-challenge-select").value;
      const challenge = APP_DATA.challenges.find(c => c.id === select);
      const date = document.getElementById("booking-date").value;
      const name = document.getElementById("booking-name").value.trim();
      const phone = document.getElementById("booking-phone").value.trim();

      if (!name || !phone || !date) {
        showToast("Prosím vyplňte všechny údaje.");
        return;
      }

      activeCheckout = {
        challengeId: challenge.id,
        challengeTitle: challenge.title,
        depositPaid: challenge.failFee,
        date: date,
        time: selectedBookingTime,
        customerName: name,
        phone: phone
      };

      const body = document.getElementById("payment-sheet-body");
      body.innerHTML = `
        <div class="space-y-4 text-center">
          <h3 class="text-lg font-bold text-white">Úhrada zálohy ${challenge.failFee} Kč</h3>
          <p class="text-xs text-gray-400">${challenge.title}</p>
          
          <div class="space-y-2">
            <button onclick="executeCheckout('Apple Pay')" class="w-full py-3.5 bg-white text-black font-bold rounded-xl flex items-center justify-center gap-2">
              <i class="fa-brands fa-apple text-lg"></i> Apple Pay
            </button>
            <button onclick="executeCheckout('Google Pay')" class="w-full py-3.5 bg-black border border-white/20 text-white font-bold rounded-xl flex items-center justify-center gap-2">
              <i class="fa-brands fa-google text-base text-yellow-400"></i> Google Pay
            </button>
            <button onclick="showCreditCardForm()" class="w-full py-3.5 bg-white/5 border border-white/10 text-white font-bold rounded-xl flex items-center justify-center gap-2">
              <i class="fa-solid fa-credit-card text-base text-gray-300"></i> Platební karta
            </button>
          </div>

          <div id="checkout-card-form" class="hidden text-left space-y-3 pt-3 border-t border-white/5">
            <input type="text" value="4242 4242 4242 4242" class="bitesight-input text-xs" placeholder="Číslo karty" />
            <div class="grid grid-cols-2 gap-2">
              <input type="text" value="08/28" class="bitesight-input text-xs" placeholder="MM/YY" />
              <input type="text" value="789" class="bitesight-input text-xs" placeholder="CVC" />
            </div>
            <button onclick="executeCheckout('Platební karta')" class="bitesight-btn-primary w-full py-3">
              Zaplatit ${challenge.failFee} Kč
            </button>
          </div>
        </div>
      `;
      openSheet('payment-sheet');
    }

    function showCreditCardForm() {
      const f = document.getElementById("checkout-card-form");
      if (f) f.classList.toggle("hidden");
    }

    function executeCheckout(method) {
      const body = document.getElementById("payment-sheet-body");
      body.innerHTML = `
        <div class="py-10 text-center space-y-3">
          <div class="w-10 h-10 border-2 border-white/25 border-t-white rounded-full animate-spin mx-auto"></div>
          <h3 class="text-sm font-bold text-white">Probíhá autorizace platby...</h3>
        </div>
      `;

      setTimeout(() => {
        const randomId = "REZ-" + Math.floor(10000 + Math.random() * 90000);
        const booking = {
          id: randomId,
          challengeId: activeCheckout.challengeId,
          challengeTitle: activeCheckout.challengeTitle,
          date: activeCheckout.date,
          time: activeCheckout.time,
          customerName: activeCheckout.customerName,
          phone: activeCheckout.phone,
          depositPaid: activeCheckout.depositPaid,
          status: "Potvrzeno",
          paidVia: method,
          qrCodeData: `KARPATY-${randomId}`
        };

        saveReservation(booking);

        body.innerHTML = `
          <div class="py-6 text-center space-y-4">
            <div class="w-12 h-12 rounded-full bg-green-500/10 border border-green-500 text-green-400 mx-auto flex items-center justify-center text-xl">✓</div>
            <h3 class="text-base font-bold text-white">Platba schválena!</h3>
            <p class="text-xs text-gray-400">Rezervace pro <strong>${activeCheckout.customerName}</strong> byla uložena.</p>
            <button onclick="closeSheet('payment-sheet'); switchView('my-bookings'); showTicketDetail('${randomId}')" class="bitesight-btn-primary w-full py-3">
              Zobrazit lístek
            </button>
          </div>
        `;
      }, 1500);
    }

    // My Bookings Renderer
    function renderMyBookings() {
      const container = document.getElementById("my-bookings-list");
      if (!container) return;

      const list = getReservations();
      if (list.length === 0) {
        container.innerHTML = `<div class="bitesight-card text-center p-6 text-xs text-gray-400">Nemáte žádné rezervace.</div>`;
        return;
      }

      container.innerHTML = list.map(res => `
        <div class="bitesight-card space-y-2">
          <div class="flex justify-between items-center text-xs border-b border-white/5 pb-2">
            <span class="font-bold text-green-400">✓ Potvrzeno</span>
            <span class="text-[10px] text-gray-500">${res.id}</span>
          </div>
          <h4 class="font-bold text-xs text-white">${res.challengeTitle}</h4>
          <p class="text-[11px] text-gray-400">
            Termín: <strong>${formatCzechDate(res.date)} v ${res.time}</strong><br/>
            Soutěžící: <span>${res.customerName}</span>
          </p>
          <div class="flex justify-between items-center pt-2 border-t border-white/5 text-[11px]">
            <button onclick="showTicketDetail('${res.id}')" class="bitesight-btn-primary py-1.5 px-3 text-[10px]">
              Otevřít QR lístek
            </button>
            <button onclick="cancelBooking('${res.id}')" class="text-red-400">Stornovat</button>
          </div>
        </div>
      `).join('');
    }

    function showTicketDetail(id) {
      const list = getReservations();
      const res = list.find(r => r.id === id);
      if (!res) return;

      const body = document.getElementById("ticket-sheet-body");
      body.innerHTML = `
        <div class="ticket-pass space-y-4">
          <div class="text-center text-xs text-yellow-400 font-bold uppercase">VSTUPNÍ LÍSTEK NA VÝZVU</div>
          
          <div class="text-center">
            <h3 class="font-bold text-base text-white leading-tight">${res.challengeTitle}</h3>
            <span class="text-[10px] text-gray-500">Soutěž pro ${res.challengeId.includes('tower') ? '2 lidi' : '1 osobu'}</span>
          </div>

          <div class="bg-black/40 p-3 rounded-lg text-xs space-y-1.5 text-gray-300 border border-white/5">
            <div>Místo: <strong>Restaurace Zlaté Karpaty</strong></div>
            <div>Adresa: <span>Hornická 2511, Ústí nad Labem</span></div>
            <div>Termín: <strong class="text-yellow-400">${formatCzechDate(res.date)} o ${res.time} hod</strong></div>
            <div>Soutěžící: <span>${res.customerName}</span></div>
          </div>

          <div class="text-center py-2">
            <div class="bg-white p-3.5 rounded-xl inline-block">
              <img src="https://api.qrserver.com/v1/create-qr-code/?size=130x130&data=${encodeURIComponent(res.qrCodeData || res.id)}" alt="QR ticket" class="w-32 h-32" />
            </div>
            <p class="text-[9px] text-gray-500 mt-2 font-mono">Předložte tento QR kód při příchodu do restaurace.</p>
          </div>

          <button onclick="closeSheet('ticket-sheet')" class="bitesight-btn-secondary w-full py-2.5">Zavřít</button>
        </div>
      `;
      openSheet('ticket-sheet');
    }

    function cancelBooking(id) {
      if (confirm("Opravdu chcete stornovat tuto rezervaci výzvy?")) {
        let list = getReservations();
        list = list.filter(r => r.id !== id);
        try {
          localStorage.setItem("batryn_res", JSON.stringify(list));
        } catch(e) {
          inMemoryReservations = list;
        }
        renderMyBookings();
        showToast("Rezervace stornována.");
      }
    }

    // Leaderboard & TikTok
    function renderTikTokView() {
      const container = document.getElementById("view-tiktok");
      if (!container) return;

      container.innerHTML = `
        <div class="bitesight-card text-center p-5 space-y-3">
          <div class="w-12 h-12 bg-white/5 rounded-full flex items-center justify-center text-xl mx-auto"><i class="fa-brands fa-tiktok"></i></div>
          <div>
            <h3 class="font-bold text-sm">@batrynstav2</h3>
            <p class="text-[11px] text-gray-400">Restaurace Zlaté Karpaty gastro výzvy</p>
          </div>
          <a href="${APP_DATA.restaurant.tiktokUrl}" target="_blank" class="bitesight-btn-primary py-2 px-6 text-xs inline-flex">
            Sledovat na TikToku
          </a>
        </div>

        <div class="space-y-3">
          <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Tabulka nejlepších výkonů</h4>
          
          <div class="space-y-2">
            ${APP_DATA.leaderboard.map((item, idx) => `
              <div class="bitesight-card p-3 flex justify-between items-center text-xs">
                <div class="flex items-center gap-2">
                  <span class="text-gray-500 font-bold">#${idx + 1}</span>
                  <div>
                    <h5 class="font-bold text-white">${item.name}</h5>
                    <p class="text-[10px] text-gray-500">${item.challenge} • ${item.time}</p>
                  </div>
                </div>
                <span class="text-[11px] font-bold text-green-400">${item.result}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // Modal Helpers
    function openSheet(id) {
      document.getElementById(id).classList.add("open");
    }

    function closeSheet(id) {
      document.getElementById(id).classList.remove("open");
    }

    // Toast Alert helper
    function showToast(msg) {
      const toast = document.getElementById("app-toast");
      if (!toast) return;
      toast.innerText = msg;
      toast.style.opacity = "1";
      toast.style.transform = "translateX(-50%) translateY(10px)";
      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateX(-50%) translateY(0)";
      }, 2500);
    }
  </script>

</body>
</html>
